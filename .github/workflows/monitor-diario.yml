name: Monitor diario de precios

on:
  schedule:
    # Corre todos los días a las 08:00 hora CDMX (14:00 UTC)
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # te permite correrlo manualmente desde GitHub también

jobs:
  monitorear:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 openpyxl playwright

      - name: Instalar navegador de Playwright
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar monitor de precios
        run: python monitor_precios.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "monitor-bot"
          git config --global user.email "monitor-bot@users.noreply.github.com"
          git add historial_precios.xlsx
          git diff --staged --quiet || git commit -m "Actualiza precios $(date +'%Y-%m-%d')"
          git push
